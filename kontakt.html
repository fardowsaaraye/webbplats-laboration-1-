    <main>
        <h1>Kontakta mig</h1>
        <p>Har du en fråga eller vill du tipsa om en serie? Kontakta mig i formuläret nedanför.</p>

        <form>
            <label for="name">Namn:</label>
            <br>
            <input type="text" id="name" name="name">
            <br>
            <label for="email">E-post:</label>
            <br>
            <input type="email" id="email" name="email">
            <br>
            <label for="subject">Vad gäller ditt meddelande?</label>
            <br>
            <select id="subject" name="subject">
                <option>Välj</option>
                <option>Fråga</option>
                <option>Serie-rekommendation</option>
                <option>Feedback</option>
            </select>
            <br>
            <label for="message">Meddelande:</label>
            <br>
            <textarea id="message" name="message">
             </textarea>
            <br>
            <button type="submit">Skicka</button>
        </form>
       <p>Du kan också nå mig direkt på <a href="mailto:faar2600@student.miun.se">faar2600@student.miun.se</a></p>
